[project]
name = "iot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prottoy Vhattacharyya", email = "prottoybhattacharya@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "deepface>=0.0.100",
    "django>=6.0.7",
    "djangorestframework>=3.17.1",
    "matplotlib>=3.11.1",
    "opencv-python>=4.11,<5",
    "requests>=2.34.2",
    "tf-keras>=2.21.0",
    "ultralytics>=8.4.114",
]

[project.scripts]
iot = "iot:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
