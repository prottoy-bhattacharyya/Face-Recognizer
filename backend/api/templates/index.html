<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #22c55e;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card h2 {
            font-size: 1.15rem;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .card p {
            font-size: 0.85rem;
            color: var(--muted);
        }

        label {
            font-size: 0.9rem;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        input::placeholder {
            color: #64748b;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: auto;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .btn-primary { background-color: var(--primary); }
        .btn-primary:hover:not(:disabled) { background-color: var(--primary-hover); }

        .btn-success { background-color: var(--success); color: #052e16; }
        .btn-success:hover:not(:disabled) { background-color: #16a34a; }

        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover:not(:disabled) { background-color: var(--danger-hover); }

        .status-box {
            margin-top: 24px;
            padding: 20px;
            border-radius: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-left-width: 5px;
            min-height: 90px;
            white-space: pre-wrap;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.9rem;
            display: none;
        }

        .status-box.info    { display: block; border-left-color: var(--primary); color: var(--text); }
        .status-box.success { display: block; border-left-color: var(--success); color: #bbf7d0; }
        .status-box.error   { display: block; border-left-color: var(--danger);  color: #fecaca; }

        .loader {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Face Recognition System</h1>
            <p>Enroll, verify, and manage registered faces via the camera.</p>
        </div>

        <div class="grid">
            <!-- Enroll Card -->
            <div class="card">
                <h2>1. Enroll Face</h2>
                <p>Look straight at the camera, then press the button.</p>
                <label for="enrollName">User Name</label>
                <input type="text" id="enrollName" placeholder="e.g. Prottoy" autocomplete="off">
                <button class="btn-primary" id="btnEnroll" onclick="enrollFace()">Enroll User</button>
            </div>

            <!-- Verify Card -->
            <div class="card">
                <h2>2. Verify Face</h2>
                <p>Captures a frame and matches it against the database.</p>
                <label for="threshold">Strictness Threshold (0.1 - 1.0)</label>
                <input type="number" id="threshold" value="0.5" step="0.1" min="0.1" max="1.0">
                <button class="btn-success" id="btnVerify" onclick="verifyFace()">Verify Face</button>
            </div>

            <!-- Remove Card -->
            <div class="card">
                <h2>3. Delete Face</h2>
                <p>Leave the name blank to delete <strong>all</strong> users.</p>
                <label for="removeName">User Name to Remove</label>
                <input type="text" id="removeName" placeholder="e.g. Prottoy" autocomplete="off">
                <button class="btn-danger" id="btnRemove" onclick="removeFace()">Delete Data</button>
            </div>
        </div>

        <!-- Output Box -->
        <div id="statusBox" class="status-box"></div>
    </div>

    <script>
        // Served by Django at the same origin, so relative URLs work.
        const API_BASE_URL = window.location.origin;

        const statusBox = document.getElementById('statusBox');

        function setStatus(data, type) {
            statusBox.className = 'status-box ' + type;
            statusBox.innerText = typeof data === 'object' ? JSON.stringify(data, null, 4) : String(data);
        }

        function toggleLoading(btnId, isLoading, defaultText) {
            const btn = document.getElementById(btnId);
            btn.disabled = isLoading;
            btn.innerHTML = isLoading ? `${defaultText} <span class="loader"></span>` : defaultText;
        }

        // --- API CALLS ---

        async function enrollFace() {
            const name = document.getElementById('enrollName').value.trim();
            if (!name) {
                setStatus('Error: Please enter a name to enroll.', 'error');
                return;
            }

            toggleLoading('btnEnroll', true, 'Enrolling');
            try {
                const response = await fetch(`${API_BASE_URL}/faces/${encodeURIComponent(name)}/`, { method: 'POST' });
                const data = await response.json();
                setStatus(data, response.ok ? 'success' : 'error');
            } catch (error) {
                setStatus(`Network Error: Make sure Django is running.\n${error.message}`, 'error');
            } finally {
                toggleLoading('btnEnroll', false, 'Enroll User');
                document.getElementById('enrollName').value = '';
            }
        }

        async function verifyFace() {
            const threshold = document.getElementById('threshold').value || 0.5;

            toggleLoading('btnVerify', true, 'Verifying');
            try {
                const response = await fetch(`${API_BASE_URL}/verify/?threshold=${threshold}`, { method: 'GET' });
                const data = await response.json();
                setStatus(data, response.ok ? 'success' : 'error');
            } catch (error) {
                setStatus(`Network Error: Make sure Django is running.\n${error.message}`, 'error');
            } finally {
                toggleLoading('btnVerify', false, 'Verify Face');
            }
        }

        async function removeFace() {
            const name = document.getElementById('removeName').value.trim();
            const url = name
                ? `${API_BASE_URL}/faces/${encodeURIComponent(name)}/`
                : `${API_BASE_URL}/faces/`;

            const confirmMsg = name
                ? `Delete user "${name}" and their facial data?`
                : 'Delete ALL users and reset the database?';

            if (!confirm(confirmMsg)) return;

            toggleLoading('btnRemove', true, 'Deleting');
            try {
                const response = await fetch(url, { method: 'DELETE' });
                const data = await response.json();
                setStatus(data, response.ok ? 'success' : 'error');
            } catch (error) {
                setStatus(`Network Error: Make sure Django is running.\n${error.message}`, 'error');
            } finally {
                toggleLoading('btnRemove', false, 'Delete Data');
                document.getElementById('removeName').value = '';
            }
        }
    </script>
</body>
</html>
