<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Room & Gate Dashboard</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --bg-radial: radial-gradient(circle at 20% -10%, #1b2540 0%, #0b0f1a 45%);
      --card-bg: #131a2b;
      --text-main: #eef1f8;
      --text-sub: #8b95ad;
      --muted-2: #6b7690;
      --border-color: #232d45;
      --border-soft: #1b2338;
      --accent-blue: #5b7cfa;
      --accent-blue-hover: #4a68e0;
      --accent-blue-soft: rgba(91, 124, 250, 0.14);
      --accent-green: #2fd480;
      --accent-amber: #f5a623;
      --accent-red: #f2495c;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.24), 0 8px 24px -8px rgba(0, 0, 0, 0.5);
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: var(--bg-radial);
      color: var(--text-main);
      padding: 32px 20px 64px;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-soft);
      flex-wrap: wrap;
      gap: 14px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-blue) 0%, #8b6bfa 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-icon svg {
      width: 20px;
      height: 20px;
      color: #fff;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    header p.subtitle {
      font-size: 0.82rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .config-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .config-box label {
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 600;
      white-space: nowrap;
    }

    .config-box input {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.88rem;
      outline: none;
      width: 180px;
    }

    .config-box input::placeholder {
      color: var(--muted-2);
    }

    .section-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted-2);
      font-weight: 700;
      margin-top: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-soft);
    }

    .card-title {
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .metric-value {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 2px;
    }

    .metric-sub {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 10px;
    }

    .metric-sub span {
      color: var(--text-main);
      font-weight: 600;
    }

    .badge {
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge-on { background: rgba(47, 212, 128, 0.14); color: var(--accent-green); }
    .badge-off { background: rgba(139, 149, 173, 0.14); color: var(--text-sub); }
    .badge-auto { background: rgba(91, 124, 250, 0.14); color: var(--accent-blue); }
    .badge-manual { background: rgba(245, 166, 35, 0.14); color: var(--accent-amber); }
    .badge-open { background: rgba(242, 73, 92, 0.14); color: var(--accent-red); }
    .badge-closed { background: rgba(47, 212, 128, 0.14); color: var(--accent-green); }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .btn {
      padding: 11px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background-color: #0d1220;
      color: var(--text-main);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn:hover { background-color: var(--border-soft); border-color: var(--accent-blue); }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background-color: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
    .btn-primary:hover { background-color: var(--accent-blue-hover); border-color: var(--accent-blue-hover); }

    .status-bar {
      font-size: 0.82rem;
      color: var(--text-sub);
      text-align: right;
      padding-top: 4px;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 14px 48px;
      }

      h1 {
        font-size: 1.2rem;
      }

      .config-box {
        width: 100%;
      }

      .config-box input {
        flex: 1;
        min-width: 0;
        width: auto;
      }

      .controls-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-title">
        <div class="header-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23-.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 20.25a48.25 48.25 0 01-8.135-.687c-1.718-.293-2.3-2.379-1.067-3.61L5 14.5" />
          </svg>
        </div>
        <div>
          <h1>IoT Control Center</h1>
          <p class="subtitle">Smart room & gate management</p>
        </div>
      </div>
      <div class="config-box">
        <label for="apiUrl">ESP8266 IP</label>
        <input type="text" id="apiUrl" value="{{ control_server_url }}">
      </div>
    </header>

    <!-- Metrics & State Controls Section -->
    <div class="section-title">Environment</div>
    <div class="grid">
      <!-- Temperature Card -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Temperature</span>
        </div>
        <div class="metric-value" id="tempVal">-- °C</div>
        <div class="metric-sub">
          Auto-Fan Threshold: <span id="thresholdVal">30</span>°C
        </div>
      </div>

      <!-- Humidity Card -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Humidity</span>
        </div>
        <div class="metric-value" id="humVal">-- %</div>
      </div>

      <!-- System Mode Card -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">System Mode</span>
          <span class="badge badge-auto" id="modeBadge">AUTO</span>
        </div>
        <div class="controls-grid">
          <button class="btn" onclick="sendControl('/mode?state=auto')">AUTO</button>
          <button class="btn" onclick="sendControl('/mode?state=manual')">MANUAL</button>
        </div>
      </div>

      <!-- Light Control Card -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Light Status</span>
          <span class="badge badge-off" id="lightBadge">OFF</span>
        </div>
        <div class="controls-grid">
          <button class="btn" onclick="sendControl('/turn_on_light')">Turn ON</button>
          <button class="btn" onclick="sendControl('/turn_off_light')">Turn OFF</button>
        </div>
      </div>

      <!-- Fan Control Card -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Fan Status</span>
          <span class="badge badge-off" id="fanBadge">OFF</span>
        </div>
        <div class="controls-grid">
          <button class="btn" onclick="sendControl('/fan?state=on')">Turn ON</button>
          <button class="btn" onclick="sendControl('/fan?state=off')">Turn OFF</button>
        </div>
      </div>
    </div>

    <!-- Gate Trigger Section -->
    <div class="section-title">Access</div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">Gate Control</span>
        <span class="badge badge-closed" id="gateBadge">CLOSED</span>
      </div>
      <button class="btn btn-primary" onclick="sendControl('/gate_open')">Open Gate (5s Auto-Close)</button>
    </div>

    <div class="status-bar" id="statusBar">Connecting to server...</div>
  </div>

  <script>
    function getBaseUrl() {
      let url = document.getElementById('apiUrl').value.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'http://' + url;
      }
      return url.endsWith('/') ? url.slice(0, -1) : url;
    }

    function updateUI(data) {
      // Sensor Data
      if (data.temperature !== undefined && data.temperature !== -999.0) {
        document.getElementById('tempVal').innerText = data.temperature.toFixed(1) + ' °C';
      }
      if (data.humidity !== undefined && data.humidity !== -999.0) {
        document.getElementById('humVal').innerText = data.humidity.toFixed(1) + ' %';
      }
      if (data.temp_threshold !== undefined) {
        document.getElementById('thresholdVal').innerText = data.temp_threshold;
      }

      // Mode Status Badge
      if (data.mode) {
        const badge = document.getElementById('modeBadge');
        badge.innerText = data.mode;
        badge.className = 'badge ' + (data.mode === 'AUTO' ? 'badge-auto' : 'badge-manual');
      }

      // Light Status Badge
      if (data.light_status) {
        const badge = document.getElementById('lightBadge');
        badge.innerText = data.light_status;
        badge.className = 'badge ' + (data.light_status === 'ON' ? 'badge-on' : 'badge-off');
      }

      // Fan Status Badge
      if (data.fan_status) {
        const badge = document.getElementById('fanBadge');
        badge.innerText = data.fan_status;
        badge.className = 'badge ' + (data.fan_status === 'ON' ? 'badge-on' : 'badge-off');
      }

      // Gate Status Badge
      if (data.gate_status) {
        const badge = document.getElementById('gateBadge');
        badge.innerText = data.gate_status;
        badge.className = 'badge ' + (data.gate_status === 'OPEN' ? 'badge-open' : 'badge-closed');
      }
    }

    async function fetchSystemStatus() {
      try {
        const response = await fetch(`${getBaseUrl()}/status`);
        if (!response.ok) throw new Error('HTTP Error ' + response.status);
        const data = await response.json();
        updateUI(data);
        document.getElementById('statusBar').innerText = 'Last updated: ' + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById('statusBar').innerText = 'Connection Error: ' + err.message;
      }
    }

    async function sendControl(endpoint) {
      try {
        document.getElementById('statusBar').innerText = 'Sending command...';
        const response = await fetch(`${getBaseUrl()}${endpoint}`);
        if (!response.ok) throw new Error('HTTP Error ' + response.status);
        const data = await response.json();
        updateUI(data);
        document.getElementById('statusBar').innerText = 'Command executed successfully!';
      } catch (err) {
        document.getElementById('statusBar').innerText = 'Command Failed: ' + err.message;
      }
    }

    // Auto-refresh full system status every 2 seconds
    setInterval(fetchSystemStatus, 2000);
    fetchSystemStatus();
  </script>
</body>
</html>
